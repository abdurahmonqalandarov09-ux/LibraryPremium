{% extends 'base.html' %}
{% block title %}Добавить издательство{% endblock %}
{% block content %}
<form class="form glass" method="POST">
    {% csrf_token %}
    <h1>Добавить издательство</h1>
    <input type="text" name="publisher_name" placeholder="Название издательства" required>
    <button class="btn btn-primary" type="submit">Добавить</button>
    <a class="btn" href="{% url 'show_publishers' %}" style="text-align:center">Отмена</a>
</form>
{% endblock %}
