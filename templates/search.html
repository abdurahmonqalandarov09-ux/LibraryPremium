{% extends 'base.html' %}
{% block title %}Поиск{% endblock %}
{% block content %}
<form class="search glass" method="GET" action="{% url 'search' %}">
    <input type="text" name="q" value="{{ q }}" placeholder="Поиск по названию...">
    <button class="btn btn-primary" type="submit">Найти</button>
</form>

<h2>Результаты по запросу «{{ q }}»</h2>
<div class="grid">
    {% for book in books %}
        {% include '_book_card.html' %}
    {% empty %}
        <p class="empty glass" style="grid-column:1/-1">Ничего не найдено.</p>
    {% endfor %}
</div>
{% endblock %}
