{% extends 'base.html' %}
{% block title %}Удалить книгу{% endblock %}
{% block content %}
<div class="auth glass">
    <h1>Удалить книгу?</h1>
    <p>Вы точно хотите удалить «{{ book.title }}»?</p>
    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Да, удалить</button>
        <a class="btn" href="{% url 'show_books' %}">Отмена</a>
    </form>
</div>
{% endblock %}
