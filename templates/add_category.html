{% extends 'base.html' %}
{% block title %}Добавить категорию{% endblock %}
{% block content %}
<form class="form glass" method="POST">
    {% csrf_token %}
    <h1>Добавить категорию</h1>
    <input type="text" name="category_name" placeholder="Название категории" required>
    <button class="btn btn-primary" type="submit">Добавить</button>
    <a class="btn" href="{% url 'show_categories' %}" style="text-align:center">Отмена</a>
</form>
{% endblock %}
