{% extends 'base.html' %}
{% block title %}Изменить книгу{% endblock %}
{% block content %}
<form class="form glass" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <h1>Изменить книгу</h1>

    <input type="text" name="title" value="{{ book.title }}" placeholder="Название" required>
    <textarea name="caption" placeholder="Краткое описание">{{ book.caption }}</textarea>
    <input type="number" step="0.01" name="price" value="{{ book.price }}" required>
    <input type="number" name="stock" value="{{ book.stock }}" required>
    <textarea name="content" placeholder="Текст книги">{{ book.content }}</textarea>

    <label>Издательство</label>
    <select name="publisher" required>
        {% for p in publishers %}
            <option value="{{ p.id }}" {% if p.id == book.publisher_id %}selected{% endif %}>{{ p.publisher_name }}</option>
        {% endfor %}
    </select>

    <label>Категории</label>
    <div class="checks">
        {% for c in categories %}
            <label><input type="checkbox" name="categories" value="{{ c.id }}" {% if c in book.categories.all %}checked{% endif %}> {{ c.category_name }}</label>
        {% endfor %}
    </div>

    <label>Авторы</label>
    <div class="checks">
        {% for a in authors %}
            <label><input type="checkbox" name="authors" value="{{ a.id }}" {% if a in book.authors.all %}checked{% endif %}> {{ a.name }}</label>
        {% endfor %}
    </div>

    <label>Новая обложка (если нужно заменить)</label>
    <input type="file" name="picture" accept="image/*">
    <label>Новое видео (если нужно заменить)</label>
    <input type="file" name="video" accept="video/mp4">

    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn" href="{% url 'show_books' %}" style="text-align:center">Отмена</a>
</form>
{% endblock %}
