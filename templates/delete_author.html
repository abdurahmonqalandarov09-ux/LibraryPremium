{% extends 'base.html' %}
{% block title %}Удалить автора{% endblock %}
{% block content %}
<div class="auth glass">
    <h1>Удалить автора?</h1>
    <p>Вы точно хотите удалить «{{ author.name }}»?</p>
    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Да, удалить</button>
        <a class="btn" href="{% url 'show_authors' %}">Отмена</a>
    </form>
</div>
{% endblock %}
