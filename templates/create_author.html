{% extends 'base.html' %}
{% block title %}Добавить автора{% endblock %}
{% block content %}
<form class="form glass" method="POST">
    {% csrf_token %}
    <h1>Добавить автора</h1>
    <input type="text" name="name" placeholder="Имя автора" required>
    <input type="number" name="age" placeholder="Возраст" min="0" required>
    <input type="text" name="country" placeholder="Страна" required>
    <button class="btn btn-primary" type="submit">Добавить</button>
    <a class="btn" href="{% url 'show_authors' %}" style="text-align:center">Отмена</a>
</form>
{% endblock %}
