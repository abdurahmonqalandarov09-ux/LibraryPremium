{% extends 'base.html' %}
{% block title %}Категории{% endblock %}
{% block content %}
<div class="top-bar">
    <h1>Категории</h1>
    <a class="btn btn-primary" href="{% url 'add_category' %}">+ Добавить категорию</a>
</div>

<div class="table-wrap glass">
    <table>
        <tr>
            <th>№</th>
            <th>Название</th>
            <th>Действия</th>
        </tr>
        {% for category in categories %}
            <tr>
                <td>{{ category.id }}</td>
                <td>{{ category.category_name }}</td>
                <td>
                    <a class="btn btn-edit btn-sm" href="{% url 'update_category' category.id %}">Изменить</a>
                    <a class="btn btn-danger btn-sm" href="{% url 'delete_category' category.id %}">Удалить</a>
                </td>
            </tr>
        {% empty %}
            <tr><td colspan="3" class="empty">Категорий пока нет.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
