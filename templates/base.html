{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Библиотека{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <nav class="navbar glass">
        <a class="logo" href="{% url 'home' %}">📚 Библиотека</a>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'my_orders' %}">Мои заказы</a>
                <a href="{% url 'profile' %}">Профиль</a>
                {% if user.is_staff %}
                    <a href="{% url 'show_books' %}">Управление</a>
                    <a href="{% url 'create_book' %}">+ Книга</a>
                {% endif %}
                <a href="{% url 'logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}">Вход</a>
                <a href="{% url 'registration' %}">Регистрация</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
