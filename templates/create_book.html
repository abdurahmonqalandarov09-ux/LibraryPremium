{% extends 'base.html' %}
{% block title %}Добавить книгу{% endblock %}
{% block content %}
<form class="form glass" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <h1>Добавить книгу</h1>

    <input type="text" name="title" placeholder="Название" required>
    <textarea name="caption" placeholder="Краткое описание"></textarea>
    <input type="number" step="0.01" name="price" placeholder="Цена" required>
    <input type="number" name="stock" placeholder="Количество на складе" required>
    <textarea name="content" placeholder="Текст книги (для чтения онлайн)"></textarea>

    <label>Издательство</label>
    <select name="publisher" required>
        {% for p in publishers %}
            <option value="{{ p.id }}">{{ p.publisher_name }}</option>
        {% endfor %}
    </select>

    <label>Категории</label>
    <div class="checks">
        {% for c in categories %}
            <label><input type="checkbox" name="categories" value="{{ c.id }}"> {{ c.category_name }}</label>
        {% endfor %}
    </div>

    <label>Авторы</label>
    <div class="checks">
        {% for a in authors %}
            <label><input type="checkbox" name="authors" value="{{ a.id }}"> {{ a.name }}</label>
        {% endfor %}
    </div>

    <label>Обложка</label>
    <input type="file" name="picture" accept="image/*">
    <label>Видео (mp4)</label>
    <input type="file" name="video" accept="video/mp4">

    <button class="btn btn-primary" type="submit">Добавить</button>
</form>
{% endblock %}
