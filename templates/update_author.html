{% extends 'base.html' %}
{% block title %}Изменить автора{% endblock %}
{% block content %}
<form class="form glass" method="POST">
    {% csrf_token %}
    <h1>Изменить автора</h1>
    <input type="text" name="name" value="{{ author.name }}" required>
    <input type="number" name="age" value="{{ author.age }}" min="0" required>
    <input type="text" name="country" value="{{ author.country }}" required>
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn" href="{% url 'show_authors' %}" style="text-align:center">Отмена</a>
</form>
{% endblock %}
