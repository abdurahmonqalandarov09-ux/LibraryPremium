{% extends 'base.html' %}
{% block title %}Профиль{% endblock %}
{% block content %}
<div class="profile glass">
    <div class="avatar">{{ user.username|slice:":1"|upper }}</div>
    <h1>{{ user.username }}</h1>
    {% if user.is_staff %}
        <span class="badge badge-green">Администратор</span>
    {% else %}
        <span class="badge">Читатель</span>
    {% endif %}
    <p class="muted">С нами с {{ user.date_joined|date:"d.m.Y" }}</p>
    <div class="actions" style="justify-content:center">
        <a class="btn btn-primary" href="{% url 'my_orders' %}">Мои заказы</a>
        <a class="btn btn-danger" href="{% url 'logout' %}">Выйти</a>
    </div>
</div>
{% endblock %}
