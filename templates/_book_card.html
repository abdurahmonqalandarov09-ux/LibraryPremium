<a class="book-card glass" href="{% url 'book_page' book.id %}">
    {% if book.picture %}
        <img src="{{ book.picture.url }}" alt="{{ book.title }}">
    {% else %}
        <div class="no-img">📖</div>
    {% endif %}
    <div class="book-info">
        <h3>{{ book.title }}</h3>
        <p class="muted">{% for a in book.authors.all %}{{ a.name }}{% if not forloop.last %}, {% endif %}{% endfor %}</p>
        <p class="muted">{{ book.price }} сомони</p>
    </div>
</a>
